[project]
name = "wehelp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ckip-transformers>=0.3.4",
    "fastapi[standard]>=0.141.1",
    "gensim>=4.4.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "numpy>=2.5.0",
    "requests>=2.34.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
]

[tool.poe.tasks.dev]
help = "Run dev server with auto-reload"
cmd = "uvicorn main:app --reload --app-dir fastapi"

[tool.poe.tasks.start]
help = "Run production server (4 workers, 0.0.0.0:8000)"
cmd = "uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --app-dir fastapi"
