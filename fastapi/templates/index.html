<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>短文本分類預測</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f5f5f5;
      padding: 40px 20px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* 深色標題列 */
    .header {
      background: #2c3e50;
      color: #fff;
      text-align: center;
      padding: 18px 20px;
      font-size: 20px;
      font-weight: bold;
    }

    /* 白色內容區 */
    .body {
      padding: 40px 30px;
    }

    /* 表單區塊 */
    .form-box {
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }

    .form-box h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #333;
    }

    .form-box input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 3px;
      margin-bottom: 20px;
    }

    .form-box input[type="text"]:focus {
      outline: none;
      border-color: #2c3e50;
    }

    .form-box button {
      background: #f0f0f0;
      border: 1px solid #999;
      padding: 6px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
    }

    .form-box button:hover {
      background: #e0e0e0;
    }

    /* 預測結果 */
    .result {
      max-width: 400px;
      margin: 30px auto 0;
      padding: 15px;
      background: #eaf4ff;
      border-left: 4px solid #2c3e50;
      color: #333;
    }

    /* 九大看板按鈕 */
    .classes {
      max-width: 400px;
      margin: 20px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .classes button {
      padding: 10px 4px;
      font-size: 13px;
      background: #f0f0f0;
      border: 1px solid #999;
      border-radius: 3px;
      cursor: pointer;
    }

    .classes button:hover {
      background: #e0e0e0;
    }

    /* display: grid 會蓋掉瀏覽器預設的 [hidden] { display: none }，要補回來 */
    .classes[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      歡迎使用短文本分類預測
    </div>

    <div class="body">
      <div class="form-box">
        <h2>輸入一篇文章的標題</h2>
        <form id="predict-form">
          <input
            type="text"
            id="title-input"
            name="title"
            required
          >
          <br>
          <button type="submit">預測分類</button>
        </form>
      </div>

      <div class="result" id="result" hidden></div>

      <div class="classes" id="classes" hidden>
        <button type="button">Baseball</button>
        <button type="button">Boy-Girl</button>
        <button type="button">C_Chat</button>
        <button type="button">HatePolitics</button>
        <button type="button">Lifeismoney</button>
        <button type="button">Military</button>
        <button type="button">PC_Shopping</button>
        <button type="button">Stock</button>
        <button type="button">Tech_Job</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("predict-form");
    const input = document.getElementById("title-input");
    const box = document.getElementById("result");
    const boards = document.getElementById("classes");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      box.hidden = false;
      box.textContent = "預測中...";
      boards.hidden = false;

      try {
        const query = new URLSearchParams({ title: input.value });
        const res = await fetch(`/api/model/prediction?${query}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        box.textContent = data.result;
      } catch (err) {
        box.textContent = `預測失敗：${err.message}`;
      }
    });

    // 九大看板按鈕：回報正確分類
    boards.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const label = button.textContent.trim();
      box.hidden = false;
      box.textContent = `回報中...`;

      try {
        const res = await fetch("/api/model/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: input.value, label }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        box.textContent = data.result;
      } catch (err) {
        box.textContent = `回報失敗：${err.message}`;
      }
    });
  </script>
</body>
</html>
